  body {

    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 { 
    font-size: 2.5em; 
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }

  .subtitle {
    color: #b8c4cc;
    margin-bottom: 30px;
    font-size: 1.1em;
  }

  .buttons { 
    margin-bottom: 30px; 
  }

  button {
    background: #e63946;
    color: white;
    border: none;
    padding: 12px 30px;
    margin: 5px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  button:hover { 
    background: #f76c6c;
    transform: translateY(-2px);
    box-shadow: 0 6px 8px rgba(0,0,0,0.4);
  }

  button:active {
    transform: translateY(0);
  }

  #resetBtn {
    background: #3d5a80;
  }

  #resetBtn:hover {
    background: #5a7ba8;
  }

  .tarot-layout {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 40px auto;
    min-height: 300px;
  }

  .card-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .card {
    width: 150px;
    height: 260px;
    border-radius: 8px;
    background-color: #1a2636;
    overflow: hidden;
    position: relative;
    perspective: 1000px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }

  .card:hover {
    transform: scale(1.08);
  }

  .card-inner {
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    position: relative;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-back {
    background: linear-gradient(135deg, #8b0000 0%, #dc143c 100%);
    border: 3px solid #ffd700;
  }

  .card-back::after {
    content: "✨";
    font-size: 5em;
    opacity: 0.3;
  }

  .card-front {
    transform: rotateY(180deg);
    background: #1a2636;
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  .reversed {
    transform: rotateY(180deg) rotate(180deg);
  }

  .labels {
    font-size: 1.2em;
    color: #ffd700;
    font-weight: bold;
    text-align: center;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .instruction {
    color: #b8c4cc;
    margin-top: 20px;
    font-style: italic;
    max-width: 600px;
  }

  .reading-section {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: rgba(26, 38, 54, 0.7);
    border-radius: 12px;
    border: 2px solid #3d5a80;
    text-align: left;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .reading-section.revealed {
    opacity: 1;
    transform: translateY(0);
  }

  .reading-section h2 {
    text-align: center;
    color: #ffd700;
    margin-bottom: 20px;
    font-size: 1.8em;
  }

  .card-name {
    color: #f76c6c;
    font-weight: bold;
    font-size: 1.3em;
    text-align: center;
    margin-bottom: 15px;
  }

  .reversed-indicator {
    color: #ff9999;
    font-style: italic;
    font-size: 0.9em;
  }

  .interpretation-text {
    color: #d4d4d4;
    line-height: 1.8;
    margin-top: 15px;
    font-size: 1.1em;
  }

  .context-text {
    color: #b8c4cc;
    font-style: italic;
    margin-bottom: 15px;
    font-size: 1em;
    text-align: center;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 768px) {
    .card {
      width: 160px;
      height: 260px;
    }

    h1 {
      font-size: 2em;
    }
  }
</style>
</head>

let currentCardData = null;

dealBtn.onclick = () => dealOneCard();
resetBtn.onclick = () => {
  layoutGrid.innerHTML = "";
  readingSection.classList.remove("revealed");
  readingSection.classList.add("hidden");
  interpretationDiv.innerHTML = "";
  currentCardData = null;
};

function dealOneCard() {
  layoutGrid.innerHTML = "";
  interpretationDiv.innerHTML = "";
  readingSection.classList.remove("revealed");
  readingSection.classList.add("hidden");

  const chosen = shuffle([...allCards])[0];
  const reversed = Math.random() < 0.5;
  
  currentCardData = { cardName: chosen, reversed: reversed };

  const container = document.createElement("div");
  container.className = "card-container";
  
  const card = document.createElement("div");
  card.className = "card";
  
  card.innerHTML = `
    <div class="card-inner">
      <div class="card-face card-back"></div>
      <div class="card-face card-front ${reversed ? "reversed" : ""}">
        <img src="cards/${chosen}" alt="${chosen}" draggable="false">
      </div>
    </div>
  `;
  
  const label = document.createElement("div");
  label.className = "labels";
  label.textContent = "Your Card";
  
  card.onclick = () => {
    const wasFlipped = card.classList.contains("flipped");
    if (!wasFlipped) {
      card.classList.add("flipped");
      setTimeout(() => revealInterpretation(), 600);
    }
  };
  
  container.appendChild(card);
  container.appendChild(label);
  layoutGrid.appendChild(container);
}

function revealInterpretation() {
  if (!currentCardData) return;
  
  const { cardName, reversed } = currentCardData;
  const cleanName = cardName.replace(".jpg", "").replace(/_/g, " ");

    `;

    const interpretation = reversed ? meaning.reversed : meaning.upright;
    
    interpretationDiv.innerHTML = `
      <p class="card-name">${cleanName} ${reversed ? '<span class="reversed-indicator">(Reversed)</span>' : ''}</p>
      <p class="context-text">This card offers guidance for your current situation or question.</p>
      <p class="interpretation-text">${interpretation}</p>
    `;
  }
  
  readingSection.classList.remove("hidden");
  setTimeout(() => {
    readingSection.classList.add("revealed");
  }, 50);
}

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>
